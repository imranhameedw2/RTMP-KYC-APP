name: Build RTMP KYC Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 4. Install web-app dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 5. Build Google AI Studio web application
      - name: Build web application
        run: bun run build

      # 6. Setup Java required by Android/Gradle
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Build Android APK
      - name: Build APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 9. Upload APK to GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RTMP-KYC-APP-debug
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
