<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Camera Body -->
  <rect x="96" y="148" width="320" height="236" rx="44" fill="#0f111a" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <path d="M192 148 L220 112 L292 112 L320 148 Z" fill="#0f111a" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Camera Lens Outer Ring -->
  <circle cx="256" cy="266" r="82" fill="url(#lens)" stroke="url(#accent)" stroke-width="12"/>
  <circle cx="256" cy="266" r="54" fill="#090d16" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- RTMP Radio Waves / Live Broadcast Waves -->
  <circle cx="256" cy="266" r="30" fill="#a855f7"/>
  <path d="M256 196 A 70 70 0 0 1 326 266" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 172 A 94 94 0 0 1 350 266" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>

  <!-- Live Red Indicator -->
  <circle cx="366" cy="188" r="14" fill="#ef4444"/>
  <circle cx="366" cy="188" r="20" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.6"/>
</svg>
